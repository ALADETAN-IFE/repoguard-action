name: Update Scanner Version

on:
  workflow_dispatch:
    inputs:
      scanner_version:
        description: "Scanner version to install (e.g. latest, 1.0.10)"
        required: true
        default: "latest"
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Configure git bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update @repoguard/scanner
        run: |
          npm install @repoguard/scanner@${{ inputs.scanner_version }}

      - name: Rebuild action bundle and verify
        run: |
          npm run build
          npm run typecheck

      - name: Commit and create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW_VERSION=$(node -p "require('./package.json').dependencies['@repoguard/scanner']")
          CLEAN_VERSION=$(node -p "require('./package.json').dependencies['@repoguard/scanner'].replace(/[^0-9.]/g, '')")

          git add package.json package-lock.json dist/index.js
          if git diff --staged --quiet; then
            echo "No changes detected. Scanner is already at version ${RAW_VERSION}."
            exit 0
          fi

          BRANCH="chore/update-scanner-${CLEAN_VERSION}-${{ github.run_number }}"
          git checkout -b "$BRANCH"

          # Commit 1: Updated scanner dependency and newly compiled dist/index.js
          git commit -m "chore(deps): update @repoguard/scanner to ${RAW_VERSION} and rebuild bundle"

          # Capture the action build commit SHA
          ACTION_SHA=$(git rev-parse HEAD)

          # Commit 2: Update README.md to reference the new action commit SHA
          sed -i -E "s/ALADETAN-IFE\/repoguard-action@[a-f0-9]{40}/ALADETAN-IFE\/repoguard-action@${ACTION_SHA}/g" README.md
          git add README.md
          git commit -m "docs: update pinned action SHA in README to ${ACTION_SHA}"

          git push origin "$BRANCH"

          gh pr create \
            --title "chore(deps): update @repoguard/scanner to ${RAW_VERSION}" \
            --body "Automated Pull Request to update \`@repoguard/scanner\` to \`${RAW_VERSION}\`, rebuild \`dist/index.js\`, and pin README to \`${ACTION_SHA}\`.\n\n* **Action Commit SHA:** \`${ACTION_SHA}\`\n* **Triggered by Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\n> 💡 Merge using **Create a merge commit** to preserve the action build commit in the git tree." \
            --base "${{ github.ref_name }}" \
            --head "$BRANCH"
